<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google" content="notranslate">
  <title>Vizimap</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    body {
      background: #f4f7fb;
      color: #172033;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, system-ui, sans-serif;
      margin: 0;
    }
    main { padding: 1rem; }
    h1 { font-size: 1.85rem; font-weight: 800; letter-spacing: -0.035em; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .view-toggle {
      align-items: center;
      background: #dfe8f2;
      border: 1px solid #c7d4e2;
      border-radius: 0.75rem;
      box-shadow: inset 0 1px 2px rgb(11 30 59 / 8%);
      display: inline-flex;
      gap: 0.2rem;
      margin-bottom: 1rem;
      padding: 0.25rem;
    }
    .view-toggle button {
      background: transparent;
      border: 0;
      border-radius: 0.55rem;
      color: #52677d;
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: 0.025em;
      min-width: 7.5rem;
      padding: 0.65rem 1.15rem;
      transition: background-color 150ms ease, box-shadow 150ms ease, color 150ms ease;
    }
    .view-toggle button:hover { color: #0b1e3b; }
    .view-toggle button:focus-visible { outline: 3px solid rgb(8 119 220 / 35%); outline-offset: 2px; }
    .view-toggle button[aria-pressed="true"] {
      background: linear-gradient(135deg, #173f8a, #7651d8);
      box-shadow: 0 2px 7px rgb(23 63 138 / 28%);
      color: white;
    }
    #configure-view button {
      background: #f8fafc;
      border: 1px solid #9bafc3;
      border-radius: 0.55rem;
      color: #28445f;
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: 0.015em;
      padding: 0.55rem 0.9rem;
      transition: background-color 150ms ease, border-color 150ms ease, box-shadow 150ms ease, color 150ms ease, transform 150ms ease;
    }
    #configure-view button:hover:not(:disabled) {
      background: #e9f0f7;
      border-color: #6f89a3;
      color: #0b1e3b;
      transform: translateY(-1px);
    }
    #configure-view button:focus-visible {
      outline: 3px solid rgb(8 119 220 / 35%);
      outline-offset: 2px;
    }
    #configure-view button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }
    #configure-view button[type="submit"],
    #configure-view > #open-roadmap,
    #configure-view > #save-roadmap,
    #add-pi,
    #add-sprint,
    #add-lane,
    #add-task {
      background: linear-gradient(135deg, #173f8a, #7651d8);
      border-color: transparent;
      box-shadow: 0 2px 7px rgb(23 63 138 / 24%);
      color: white;
    }
    #configure-view button[type="submit"]:hover:not(:disabled),
    #configure-view > #open-roadmap:hover:not(:disabled),
    #configure-view > #save-roadmap:hover:not(:disabled),
    #add-pi:hover:not(:disabled),
    #add-sprint:hover:not(:disabled),
    #add-lane:hover:not(:disabled),
    #add-task:hover:not(:disabled) {
      background: linear-gradient(135deg, #123572, #6542c5);
      border-color: transparent;
      color: white;
    }
    #configure-view .manager-list li button:last-child,
    #configure-view .delete-warning button:first-of-type {
      background: #fff5f5;
      border-color: #e6a5a5;
      color: #a61b1b;
    }
    #configure-view .manager-list li button:last-child:hover:not(:disabled),
    #configure-view .delete-warning button:first-of-type:hover:not(:disabled) {
      background: #b91c1c;
      border-color: #b91c1c;
      color: white;
    }
    label[for="tick-mode"] {
      color: #52677d;
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: 0.025em;
      margin-right: 0.35rem;
    }
    #tick-mode {
      background: #f8fafc;
      border: 1px solid #c7d4e2;
      border-radius: 0.55rem;
      color: #172033;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 0.55rem 2rem 0.55rem 0.75rem;
    }
    #tick-mode:hover { border-color: #9bafc3; }
    #tick-mode:focus-visible { outline: 3px solid rgb(8 119 220 / 35%); outline-offset: 2px; }
    .roadmap-manager { border: 1px solid #cbd5e1; border-radius: 0.5rem; margin-top: 1rem; padding: 1rem; }
    .roadmap-manager h2 { display: inline-block; font-size: 1.2rem; margin: 0 1rem 0 0; }
    .manager-list { list-style: none; margin: 1rem 0 0; padding: 0; }
    .manager-list li { align-items: center; border-top: 1px solid #e2e8f0; display: flex; gap: 0.5rem; padding: 0.65rem 0; }
    .manager-details { flex: 1; }
    .manager-editor { background: #f8fafc; border-radius: 0.4rem; margin-top: 1rem; padding: 1rem; }
    .manager-editor[hidden] { display: none; }
    .manager-fields { display: flex; flex-wrap: wrap; gap: 0.75rem; }
    .manager-fields label { display: grid; gap: 0.25rem; }
    .manager-fields label[hidden] { display: none; }
    .manager-actions { display: flex; gap: 0.5rem; margin-top: 1rem; }
    .form-error, .delete-warning { color: #b91c1c; }
    .delete-warning { background: #fef2f2; border: 1px solid #fecaca; border-radius: 0.4rem; margin-top: 1rem; padding: 0.75rem; }
    .chart-container { position: relative; }
    .task-description-overlay {
      background: white;
      border: 1px solid #cbd5e1;
      border-radius: 0.5rem;
      box-shadow: 0 10px 25px rgb(15 23 42 / 20%);
      box-sizing: border-box;
      left: 50%;
      max-height: calc(100% - 2rem);
      max-width: 32rem;
      overflow: auto;
      padding: 1rem 3rem 1rem 1rem;
      position: absolute;
      top: 1rem;
      transform: translateX(-50%);
      width: calc(100% - 2rem);
      z-index: 10;
    }
    .task-description-overlay[hidden] { display: none; }
    .task-description-overlay h2 { font-size: 1.2rem; margin: 0 0 0.75rem; }
    .task-description-overlay p { margin: 0; white-space: pre-wrap; }
    .task-description-close { position: absolute; right: 0.75rem; top: 0.75rem; }
  </style>
</head>
<body>
  <main>
    <h1>Vizimap</h1>
    <nav class="view-toggle" aria-label="Roadmap view">
      <button id="show-chart" type="button" aria-pressed="true" aria-controls="chart-view">Chart</button>
      <button id="show-configure" type="button" aria-pressed="false" aria-controls="configure-view">Configure</button>
    </nav>
    <section id="chart-view" aria-label="Chart view">
      <label for="tick-mode">Timeline labels:</label>
      <select id="tick-mode">
        <option value="calendar" selected>Calendar</option>
        <option value="sprint">Sprint</option>
        <option value="pi">PI</option>
      </select>
      <div class="chart-container">
        <div id="roadmap-chart" style="width: 100%; min-height: 640px;"></div>
        <aside id="task-description-overlay" class="task-description-overlay" role="dialog" aria-labelledby="task-description-title" hidden>
          <button id="task-description-close" class="task-description-close" type="button" aria-label="Close task description">Close</button>
          <h2 id="task-description-title"></h2>
          <p id="task-description-content"></p>
        </aside>
      </div>
    </section>
    <section id="configure-view" aria-label="Configure view" hidden>
      <button id="open-roadmap" type="button">Open Roadmap</button>
      <button id="save-roadmap" type="button">Save</button>
      <p id="file-status" role="status" aria-live="polite"></p>
      <section class="roadmap-manager" aria-labelledby="chart-settings-title">
      <h2 id="chart-settings-title">Chart Settings</h2>
      <form id="chart-settings-form" class="manager-editor">
        <div class="manager-fields">
          <label>Chart Header <input id="chart-title" name="chartTitle" type="text" required></label>
          <label>Chart Footer <input id="x-axis-title" name="xAxisTitle" type="text" required></label>
          <label>Theme
            <select id="chart-theme" name="chartTheme" required>
              <option value="vizimap">Vizimap</option>
              <option value="ggplot2">ggplot2</option>
              <option value="seaborn">seaborn</option>
              <option value="simple_white">simple_white</option>
              <option value="plotly">plotly</option>
              <option value="plotly_white">plotly_white</option>
              <option value="plotly_dark">plotly_dark</option>
              <option value="presentation">presentation</option>
              <option value="xgridoff">xgridoff</option>
              <option value="ygridoff">ygridoff</option>
              <option value="gridon">gridon</option>
            </select>
          </label>
        </div>
        <div class="manager-actions">
          <button type="submit">Save changes</button>
        </div>
      </form>
      </section>
      <section class="roadmap-manager" aria-labelledby="pi-manager-title">
      <h2 id="pi-manager-title">Program Increments</h2>
      <button id="add-pi" type="button">Add PI</button>
      <button id="export-pis" type="button">Export CSV</button>
      <div id="pi-delete-warning" class="delete-warning" role="alert" hidden></div>
      <form id="pi-editor" class="manager-editor" hidden novalidate>
        <div class="manager-fields">
          <label>Name <input id="pi-name" name="name" type="text" required></label>
          <label>Start date <input id="pi-start" name="start" type="date" required></label>
          <label>End date <input id="pi-end" name="end" type="date" required></label>
          <label><input id="pi-color-override" type="checkbox"> Override theme color</label>
          <label>Color <input id="pi-color" name="color" type="color" disabled></label>
        </div>
        <p id="pi-form-error" class="form-error" role="alert" hidden></p>
        <div class="manager-actions">
          <button id="save-pi" type="submit">Add PI</button>
          <button id="cancel-pi" type="button">Cancel</button>
        </div>
      </form>
      <ul id="pi-list" class="manager-list"></ul>
      </section>
      <section class="roadmap-manager" aria-labelledby="sprint-manager-title">
      <h2 id="sprint-manager-title">Sprints</h2>
      <button id="add-sprint" type="button">Add Sprint</button>
      <button id="export-sprints" type="button">Export CSV</button>
      <form id="sprint-editor" class="manager-editor" hidden novalidate>
        <div class="manager-fields">
          <label>Name <input id="sprint-name" name="name" type="text" required></label>
          <label>Start date <input id="sprint-start" name="start" type="date" required></label>
          <label>End date <input id="sprint-end" name="end" type="date" required></label>
          <label>Parent PI
            <select id="sprint-pi" name="piName" required></select>
          </label>
        </div>
        <p id="sprint-form-error" class="form-error" role="alert" hidden></p>
        <div class="manager-actions">
          <button id="save-sprint" type="submit">Add Sprint</button>
          <button id="cancel-sprint" type="button">Cancel</button>
        </div>
      </form>
      <ul id="sprint-list" class="manager-list"></ul>
      </section>
      <section class="roadmap-manager" aria-labelledby="lane-manager-title">
      <h2 id="lane-manager-title">Lanes</h2>
      <button id="add-lane" type="button">Add Lane</button>
      <button id="export-lanes" type="button">Export CSV</button>
      <div id="lane-delete-warning" class="delete-warning" role="alert" hidden></div>
      <form id="lane-editor" class="manager-editor" hidden novalidate>
        <div class="manager-fields">
          <label>Name <input id="lane-name" name="name" type="text" required></label>
          <label><input id="lane-color-override" type="checkbox"> Override theme color</label>
          <label>Color <input id="lane-color" name="color" type="color" disabled></label>
        </div>
        <p id="lane-form-error" class="form-error" role="alert" hidden></p>
        <div class="manager-actions">
          <button id="save-lane" type="submit">Add Lane</button>
          <button id="cancel-lane" type="button">Cancel</button>
        </div>
      </form>
      <ul id="lane-list" class="manager-list"></ul>
      </section>
      <section class="roadmap-manager" aria-labelledby="task-manager-title">
      <h2 id="task-manager-title">Tasks</h2>
      <button id="add-task" type="button">Add Task</button>
      <button id="export-tasks" type="button">Export CSV</button>
      <form id="task-editor" class="manager-editor" hidden novalidate>
        <div class="manager-fields">
          <label>Name <input id="task-name" name="name" type="text" required></label>
          <label>Start date <input id="task-start" name="start" type="date" required></label>
          <label>End date <input id="task-end" name="end" type="date" required></label>
          <label>Status
            <select id="task-status" name="status" required></select>
          </label>
          <label>Owner <input id="task-owner" name="owner" type="text"></label>
          <label>Color <input id="task-color" name="color" type="color"></label>
          <label>Lane
            <select id="task-lane" name="lane" required></select>
          </label>
          <label>Description <textarea id="task-description" name="description" rows="4"></textarea></label>
          <label>Description display
            <select id="task-description-position" name="descriptionPosition">
              <option value="hidden">Hidden</option>
              <option value="above">Above</option>
              <option value="below">Below</option>
              <option value="inline">Inline</option>
            </select>
          </label>
          <label id="task-milestone-position-field" hidden>Milestone position
            <select id="task-milestone-position" name="milestonePosition">
              <option value="on">On lane</option>
              <option value="above">Above lane</option>
              <option value="below">Below lane</option>
            </select>
          </label>
          <label id="task-milestone-shape-field" hidden>Milestone shape
            <select id="task-milestone-shape" name="milestoneShape">
              <option value="octagon">Octagon</option>
              <option value="star">Star</option>
              <option value="triangle">Triangle</option>
              <option value="diamond" selected>Diamond</option>
              <option value="circle">Circle</option>
            </select>
          </label>
        </div>
        <p id="task-form-error" class="form-error" role="alert" hidden></p>
        <div class="manager-actions">
          <button id="save-task" type="submit">Add Task</button>
          <button id="cancel-task" type="button">Cancel</button>
        </div>
      </form>
      <ul id="task-list" class="manager-list"></ul>
      </section>
    </section>
  </main>

      const dateStamp = [
        date.getFullYear(),
        String(date.getMonth() + 1).padStart(2, "0"),
        String(date.getDate()).padStart(2, "0")
      ].join("-");
      const url = URL.createObjectURL(new Blob(["\uFEFF", csv], { type: "text/csv;charset=utf-8" }));
      const download = document.createElement("a");
      download.href = url;
      download.download = `vizimap-${entity}-${dateStamp}.csv`;

        remove.type = "button";
        remove.textContent = "Delete";
        remove.setAttribute("aria-label", `Delete ${task.name}`);
        remove.addEventListener("click", () => deleteTask(index));
        item.append(details, edit, remove);
        taskList.append(item);
      });

      if (!TASKS.length) {
        const empty = document.createElement("li");
        empty.textContent = "No Tasks yet.";
        taskList.append(empty);
      }
    };

    document.getElementById("add-task").addEventListener("click", () => openTaskEditor(null));
    document.getElementById("cancel-task").addEventListener("click", closeTaskEditor);
    taskEditor.addEventListener("submit", async event => {
      event.preventDefault();
      const name = taskName.value.trim();
      const start = taskStart.value;
      const end = taskEnd.value;
      const status = taskStatus.value;
      const owner = taskOwner.value.trim();
      const color = taskColor.value;
      const lane = taskLane.value;
      const description = taskDescription.value.trim();
      const descriptionPosition = taskDescriptionPosition.value;
      const milestonePosition = taskMilestonePosition.value;
      const milestoneShape = taskMilestoneShape.value;

      if (!name) {
        taskFormError.textContent = "Name is required.";
        taskFormError.hidden = false;
        taskName.focus();
        return;
      }
      if (!start || !end) {
        taskFormError.textContent = "Start date and end date are required.";
        taskFormError.hidden = false;
        (!start ? taskStart : taskEnd).focus();
        return;
      }
      if (end < start) {
        taskFormError.textContent = "End date must be on or after start date.";
        taskFormError.hidden = false;
        taskEnd.focus();
        return;
      }
      if (!TASK_STATUSES.includes(status)) {
        taskFormError.textContent = "Select a status from the available options.";
        taskFormError.hidden = false;
        taskStatus.focus();
        return;
      }

      if (!LANES.some(({ name: laneNameOption }) => laneNameOption === lane)) {
        taskFormError.textContent = "Select a lane from the current Lanes.";
        taskFormError.hidden = false;
        taskLane.focus();
        return;
      }
      if (!DESCRIPTION_POSITIONS.includes(descriptionPosition)) {
        taskFormError.textContent = "Select a description display position.";
        taskFormError.hidden = false;
        taskDescriptionPosition.focus();
        return;
      }
      if (start === end && !MILESTONE_POSITIONS.includes(milestonePosition)) {
        taskFormError.textContent = "Select a milestone position.";
        taskFormError.hidden = false;
        taskMilestonePosition.focus();
        return;
      }
      if (start === end && !MILESTONE_SHAPES.includes(milestoneShape)) {
        taskFormError.textContent = "Select a milestone shape.";
        taskFormError.hidden = false;
        taskMilestoneShape.focus();
        return;
      }
      const task = { name, start, end, status, lane, color, descriptionPosition };
      if (start === end) {
        task.milestonePosition = milestonePosition;
        task.milestoneShape = milestoneShape;
      }
      if (owner) task.owner = owner;
      if (description) task.description = description;
      if (editingTaskIndex === null) {
        TASKS.push(task);
      } else {
        TASKS[editingTaskIndex] = task;
      }
      closeTaskEditor();
      renderTaskList();
      await refreshRoadmap();
    });

    renderTaskList();

    const openRoadmap = document.getElementById("open-roadmap");
    const saveRoadmap = document.getElementById("save-roadmap");
    const fileStatus = document.getElementById("file-status");
    let roadmapFileHandle = null;

    const filePickerOptions = {
      types: [{
        description: "Vizimap roadmap",
        accept: { "application/json": [".json"] }
      }]
    };

    const showFileError = (action, error) => {
      if (error.name === "AbortError") return;
      fileStatus.textContent = `Could not ${action}: ${error.message}`;
    };

    const requireFileSystemAccess = () => {
      if ("showOpenFilePicker" in window && "showSaveFilePicker" in window) return true;
      fileStatus.textContent = "Open and Save require Chrome or Edge with File System Access API support.";
      return false;
    };

    const parseRoadmap = text => {
      const roadmap = JSON.parse(text);
      if (
        !roadmap ||
        !Array.isArray(roadmap.programIncrements) ||
        !Array.isArray(roadmap.sprints) ||
        !Array.isArray(roadmap.lanes) ||
        !Array.isArray(roadmap.tasks)
      ) {
        throw new Error("Roadmap JSON must contain programIncrements, sprints, lanes, and tasks arrays.");
      }
      return roadmap;
    };

    openRoadmap.addEventListener("click", async () => {
      if (!requireFileSystemAccess()) return;
      openRoadmap.disabled = true;

      try {
        const [fileHandle] = await window.showOpenFilePicker(filePickerOptions);
        const file = await fileHandle.getFile();
        const roadmap = parseRoadmap(await file.text());

        PROGRAM_INCREMENTS = roadmap.programIncrements;
        SPRINTS = roadmap.sprints;
        LANES = roadmap.lanes;
        TASKS = roadmap.tasks;
        CHART_TITLE = typeof roadmap.chartTitle === "string"
          ? roadmap.chartTitle
          : DEFAULT_CHART_TITLE;
        X_AXIS_TITLE = typeof roadmap.xAxisTitle === "string"
          ? roadmap.xAxisTitle
          : DEFAULT_X_AXIS_TITLE;
        CHART_THEME = typeof roadmap.chartTheme === "string" && roadmap.chartTheme in CHART_THEMES
          ? roadmap.chartTheme
          : DEFAULT_CHART_THEME;
        roadmapFileHandle = fileHandle;
        closePiEditor();
        closeSprintEditor();
        closeLaneEditor();
        closeTaskEditor();
        hideDeleteWarning();
        hideLaneDeleteWarning();
        renderPiList();
        renderSprintList();
        renderLaneList();
        renderTaskList();
        renderChartSettings();
        await refreshRoadmap();
        fileStatus.textContent = `Opened ${file.name}`;
      } catch (error) {
        showFileError("open roadmap", error);
      } finally {
        openRoadmap.disabled = false;
      }
    });

    saveRoadmap.addEventListener("click", async () => {
      if (!requireFileSystemAccess()) return;
      saveRoadmap.disabled = true;

      try {
        const fileHandle = roadmapFileHandle || await window.showSaveFilePicker({
          ...filePickerOptions,
          suggestedName: "roadmap.json"
        });
        const writable = await fileHandle.createWritable();
        await writable.write(JSON.stringify({
          programIncrements: PROGRAM_INCREMENTS,
          sprints: SPRINTS,
          lanes: LANES,
          tasks: TASKS,
          chartTitle: CHART_TITLE,
          xAxisTitle: X_AXIS_TITLE,
          chartTheme: CHART_THEME
        }, null, 2) + "\n");
        await writable.close();
        roadmapFileHandle = fileHandle;
        fileStatus.textContent = `Saved ${fileHandle.name}`;
      } catch (error) {
        showFileError("save roadmap", error);
      } finally {
        saveRoadmap.disabled = false;
      }
    });

    requireFileSystemAccess();
  </script>
</body>
</html>
