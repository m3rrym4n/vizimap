<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vizimap</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #172033; }
    main { padding: 1rem; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .view-toggle { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .view-toggle button[aria-pressed="true"] { background: #2563eb; color: white; }
    .roadmap-manager { border: 1px solid #cbd5e1; border-radius: 0.5rem; margin-top: 1rem; padding: 1rem; }
    .roadmap-manager h2 { display: inline-block; font-size: 1.2rem; margin: 0 1rem 0 0; }
    .manager-list { list-style: none; margin: 1rem 0 0; padding: 0; }
    .manager-list li { align-items: center; border-top: 1px solid #e2e8f0; display: flex; gap: 0.5rem; padding: 0.65rem 0; }
    .manager-details { flex: 1; }
    .manager-editor { background: #f8fafc; border-radius: 0.4rem; margin-top: 1rem; padding: 1rem; }
    .manager-editor[hidden] { display: none; }
    .manager-fields { display: flex; flex-wrap: wrap; gap: 0.75rem; }
    .manager-fields label { display: grid; gap: 0.25rem; }
    .manager-actions { display: flex; gap: 0.5rem; margin-top: 1rem; }
    .form-error, .delete-warning { color: #b91c1c; }
    .delete-warning { background: #fef2f2; border: 1px solid #fecaca; border-radius: 0.4rem; margin-top: 1rem; padding: 0.75rem; }
    .chart-container { position: relative; }
    .task-description-overlay {
      background: white;
      border: 1px solid #cbd5e1;
      border-radius: 0.5rem;
      box-shadow: 0 10px 25px rgb(15 23 42 / 20%);
      box-sizing: border-box;
      left: 50%;
      max-height: calc(100% - 2rem);
      max-width: 32rem;
      overflow: auto;
      padding: 1rem 3rem 1rem 1rem;
      position: absolute;
      top: 1rem;
      transform: translateX(-50%);
      width: calc(100% - 2rem);
      z-index: 10;
    }
    .task-description-overlay[hidden] { display: none; }
    .task-description-overlay h2 { font-size: 1.2rem; margin: 0 0 0.75rem; }
    .task-description-overlay p { margin: 0; white-space: pre-wrap; }
    .task-description-close { position: absolute; right: 0.75rem; top: 0.75rem; }
  </style>
</head>
<body>
  <main>
    <h1>Vizimap</h1>
    <nav class="view-toggle" aria-label="Roadmap view">
      <button id="show-chart" type="button" aria-pressed="true" aria-controls="chart-view">Chart</button>
      <button id="show-configure" type="button" aria-pressed="false" aria-controls="configure-view">Configure</button>
    </nav>
    <section id="chart-view" aria-label="Chart view">
      <label for="tick-mode">Timeline labels:</label>
      <select id="tick-mode">
        <option value="calendar" selected>Calendar</option>
        <option value="sprint">Sprint</option>
        <option value="pi">PI</option>
      </select>
      <button id="export-png" type="button">Export PNG</button>
      <div class="chart-container">
        <div id="roadmap-chart" style="width: 100%; min-height: 640px;"></div>
        <aside id="task-description-overlay" class="task-description-overlay" role="dialog" aria-labelledby="task-description-title" hidden>
          <button id="task-description-close" class="task-description-close" type="button" aria-label="Close task description">Close</button>
          <h2 id="task-description-title"></h2>
          <p id="task-description-content"></p>
        </aside>
      </div>
    </section>
    <section id="configure-view" aria-label="Configure view" hidden>
      <button id="open-roadmap" type="button">Open Roadmap</button>
      <button id="save-roadmap" type="button">Save</button>
      <p id="file-status" role="status" aria-live="polite"></p>
      <section class="roadmap-manager" aria-labelledby="chart-settings-title">
      <h2 id="chart-settings-title">Chart Settings</h2>
      <form id="chart-settings-form" class="manager-editor">
        <div class="manager-fields">
          <label>Chart Title <input id="chart-title" name="chartTitle" type="text" required></label>
          <label>X-axis Label <input id="x-axis-title" name="xAxisTitle" type="text" required></label>
        </div>
        <div class="manager-actions">
          <button type="submit">Save changes</button>
        </div>
      </form>
      </section>
      <section class="roadmap-manager" aria-labelledby="pi-manager-title">
      <h2 id="pi-manager-title">Program Increments</h2>
      <button id="add-pi" type="button">Add PI</button>
      <div id="pi-delete-warning" class="delete-warning" role="alert" hidden></div>
      <form id="pi-editor" class="manager-editor" hidden novalidate>
        <div class="manager-fields">
          <label>Name <input id="pi-name" name="name" type="text" required></label>
          <label>Start date <input id="pi-start" name="start" type="date" required></label>
          <label>End date <input id="pi-end" name="end" type="date" required></label>
        </div>
        <p id="pi-form-error" class="form-error" role="alert" hidden></p>
        <div class="manager-actions">
          <button id="save-pi" type="submit">Add PI</button>
          <button id="cancel-pi" type="button">Cancel</button>
        </div>
      </form>
      <ul id="pi-list" class="manager-list"></ul>
      </section>
      <section class="roadmap-manager" aria-labelledby="sprint-manager-title">
      <h2 id="sprint-manager-title">Sprints</h2>
      <button id="add-sprint" type="button">Add Sprint</button>
      <form id="sprint-editor" class="manager-editor" hidden novalidate>
        <div class="manager-fields">
          <label>Name <input id="sprint-name" name="name" type="text" required></label>
          <label>Start date <input id="sprint-start" name="start" type="date" required></label>
          <label>End date <input id="sprint-end" name="end" type="date" required></label>
          <label>Parent PI
            <select id="sprint-pi" name="piName" required></select>
          </label>
        </div>
        <p id="sprint-form-error" class="form-error" role="alert" hidden></p>
        <div class="manager-actions">
          <button id="save-sprint" type="submit">Add Sprint</button>
          <button id="cancel-sprint" type="button">Cancel</button>
        </div>
      </form>
      <ul id="sprint-list" class="manager-list"></ul>
      </section>
      <section class="roadmap-manager" aria-labelledby="lane-manager-title">
      <h2 id="lane-manager-title">Lanes</h2>
      <button id="add-lane" type="button">Add Lane</button>
      <div id="lane-delete-warning" class="delete-warning" role="alert" hidden></div>
      <form id="lane-editor" class="manager-editor" hidden novalidate>
        <div class="manager-fields">
          <label>Name <input id="lane-name" name="name" type="text" required></label>
        </div>
        <p id="lane-form-error" class="form-error" role="alert" hidden></p>
        <div class="manager-actions">
          <button id="save-lane" type="submit">Add Lane</button>
          <button id="cancel-lane" type="button">Cancel</button>
        </div>
      </form>
      <ul id="lane-list" class="manager-list"></ul>
      </section>
      <section class="roadmap-manager" aria-labelledby="task-manager-title">
      <h2 id="task-manager-title">Tasks</h2>
      <button id="add-task" type="button">Add Task</button>
      <form id="task-editor" class="manager-editor" hidden novalidate>
        <div class="manager-fields">
          <label>Name <input id="task-name" name="name" type="text" required></label>
          <label>Start date <input id="task-start" name="start" type="date" required></label>
          <label>End date <input id="task-end" name="end" type="date" required></label>
          <label>Status
            <select id="task-status" name="status" required></select>
          </label>
          <label>Owner <input id="task-owner" name="owner" type="text"></label>
          <label>Color <input id="task-color" name="color" type="color"></label>
          <label>Lane
            <select id="task-lane" name="lane" required></select>
          </label>
          <label>Description <textarea id="task-description" name="description" rows="4"></textarea></label>
          <label>Description display
            <select id="task-description-position" name="descriptionPosition">
              <option value="hidden">Hidden</option>
              <option value="above">Above</option>
              <option value="below">Below</option>
            </select>
          </label>
        </div>
        <p id="task-form-error" class="form-error" role="alert" hidden></p>
        <div class="manager-actions">
          <button id="save-task" type="submit">Add Task</button>
          <button id="cancel-task" type="button">Cancel</button>
        </div>
      </form>
      <ul id="task-list" class="manager-list"></ul>
      </section>
    </section>
  </main>

  <script>
    const DEFAULT_CHART_TITLE = "Product Roadmap";
    const DEFAULT_X_AXIS_TITLE = "Date";
    // Plotly's plotly_white template, embedded because Plotly.js does not support named templates.
    const PLOTLY_WHITE_TEMPLATE = {"layout":{"autotypenumbers":"strict","colorway":["#636efa","#EF553B","#00cc96","#ab63fa","#FFA15A","#19d3f3","#FF6692","#B6E880","#FF97FF","#FECB52"],"font":{"color":"#2a3f5f"},"hovermode":"closest","hoverlabel":{"align":"left"},"paper_bgcolor":"white","plot_bgcolor":"white","polar":{"bgcolor":"white","angularaxis":{"gridcolor":"#EBF0F8","linecolor":"#EBF0F8","ticks":""},"radialaxis":{"gridcolor":"#EBF0F8","linecolor":"#EBF0F8","ticks":""}},"ternary":{"bgcolor":"white","aaxis":{"gridcolor":"#DFE8F3","linecolor":"#A2B1C6","ticks":""},"baxis":{"gridcolor":"#DFE8F3","linecolor":"#A2B1C6","ticks":""},"caxis":{"gridcolor":"#DFE8F3","linecolor":"#A2B1C6","ticks":""}},"coloraxis":{"colorbar":{"outlinewidth":0,"ticks":""}},"colorscale":{"sequential":[[0.0,"#0d0887"],[0.1111111111111111,"#46039f"],[0.2222222222222222,"#7201a8"],[0.3333333333333333,"#9c179e"],[0.4444444444444444,"#bd3786"],[0.5555555555555556,"#d8576b"],[0.6666666666666666,"#ed7953"],[0.7777777777777778,"#fb9f3a"],[0.8888888888888888,"#fdca26"],[1.0,"#f0f921"]],"sequentialminus":[[0.0,"#0d0887"],[0.1111111111111111,"#46039f"],[0.2222222222222222,"#7201a8"],[0.3333333333333333,"#9c179e"],[0.4444444444444444,"#bd3786"],[0.5555555555555556,"#d8576b"],[0.6666666666666666,"#ed7953"],[0.7777777777777778,"#fb9f3a"],[0.8888888888888888,"#fdca26"],[1.0,"#f0f921"]],"diverging":[[0,"#8e0152"],[0.1,"#c51b7d"],[0.2,"#de77ae"],[0.3,"#f1b6da"],[0.4,"#fde0ef"],[0.5,"#f7f7f7"],[0.6,"#e6f5d0"],[0.7,"#b8e186"],[0.8,"#7fbc41"],[0.9,"#4d9221"],[1,"#276419"]]},"xaxis":{"gridcolor":"#EBF0F8","linecolor":"#EBF0F8","ticks":"","title":{"standoff":15},"zerolinecolor":"#EBF0F8","automargin":true,"zerolinewidth":2},"yaxis":{"gridcolor":"#EBF0F8","linecolor":"#EBF0F8","ticks":"","title":{"standoff":15},"zerolinecolor":"#EBF0F8","automargin":true,"zerolinewidth":2},"scene":{"xaxis":{"backgroundcolor":"white","gridcolor":"#DFE8F3","linecolor":"#EBF0F8","showbackground":true,"ticks":"","zerolinecolor":"#EBF 11111111111,"#46039f"],[0.2222222222222222,"#7201a8"],[0.3333333333333333,"#9c179e"],[0.4444444444444444,"#bd3786"],[0.5555555555555556,"#d8576b"],[0.6666666666666666,"#ed7953"],[0.7777777777777778,"#fb9f3a"],[0.8888888888888888,"#fdca26"],[1.0,"#f0f921"]]}],"surface":[{"type":"surface","colorbar":{"outlinewidth":0,"ticks":""},"colorscale":[[0.0,"#0d0887"],[0.1111111111111111,"#46039f"],[0.2222222222222222,"#7201a8"],[0.3333333333333333,"#9c179e"],[0.4444444444444444,"#bd3786"],[0.5555555555555556,"#d8576b"],[0.6666666666666666,"#ed7953"],[0.7777777777777778,"#fb9f3a"],[0.8888888888888888,"#fdca26"],[1.0,"#f0f921"]]}],"mesh3d":[{"type":"mesh3d","colorbar":{"outlinewidth":0,"ticks":""}}],"scatter":[{"fillpattern":{"fillmode":"overlay","size":10,"solidity":0.2},"type":"scatter"}],"parcoords":[{"type":"parcoords","line":{"colorbar":{"outlinewidth":0,"ticks":""}}}],"scatterpolargl":[{"type":"scatterpolargl","marker":{"colorbar":{"outlinewidth":0,"ticks":""}}}],"bar":[{"error_x":{"color":"#2a3f5f"},"error_y":{"color":"#2a3f5f"},"marker":{"line":{"color":"white","width":0.5},"pattern":{"fillmode":"overlay","size":10,"solidity":0.2}},"type":"bar"}],"scattergeo":[{"type":"scattergeo","marker":{"colorbar":{"outlinewidth":0,"ticks":""}}}],"scatterpolar":[{"type":"scatterpolar","marker":{"colorbar":{"outlinewidth":0,"ticks":""}}}],"histogram":[{"marker":{"pattern":{"fillmode":"overlay","size":10,"solidity":0.2}},"type":"histogram"}],"scattergl":[{"type":"scattergl","marker":{"colorbar":{"outlinewidth":0,"ticks":""}}}],"scatter3d":[{"type":"scatter3d","line":{"colorbar":{"outlinewidth":0,"ticks":""}},"marker":{"colorbar":{"outlinewidth":0,"ticks":""}}}],"scattermap":[{"type":"scattermap","marker":{"colorbar":{"outlinewidth":0,"ticks":""}}}],"scatterternary":[{"type":"scatterternary","marker":{"colorbar":{"outlinewidth":0,"ticks":""}}}],"scattercarpet":[{"type":"scattercarpet","marker":{"colorbar":{"outlinewidth":0,"ticks":""}}}],"carpet":[{"aaxis":{"endlinecolor":"#2a3f5f","gridcolor":"#C8D4E3","linecolor":"#C8D4E3","minorgridcolor":"#C8D4E3","startlinecolor":"#2a3f5f"},"baxis":{"endlinecolor":"#2a3f5f","gridcolor":"#C8D4E3","linecolor":"#C8D4E3","minorgridcolor":"#C8D4E3","startlinecolor":"#2a3f5f"},"type":"carpet"}],"table":[{"cells":{"fill":{"color":"#EBF0F8"},"line":{"color":"white"}},"header":{"fill":{"color":"#C8D4E3"},"line":{"color":"white"}},"type":"table"}],"barpolar":[{"marker":{"line":{"color":"white","width":0.5},"pattern":{"fillmode":"overlay","size":10,"solidity":0.2}},"type":"barpolar"}],"pie":[{"automargin":true,"type":"pie"}]}};
    let CHART_TITLE = DEFAULT_CHART_TITLE;
    let X_AXIS_TITLE = DEFAULT_X_AXIS_TITLE;

    let PROGRAM_INCREMENTS = [
      { name: "PI-1", start: "2025-01-06", end: "2025-03-28" },
      { name: "PI-2", start: "2025-03-31", end: "2025-06-20" }
    ];

    let SPRINTS = [
      { name: "Sprint 1.1", start: "2025-01-06", end: "2025-01-24", piName: "PI-1" },
      { name: "Sprint 1.2", start: "2025-01-27", end: "2025-02-14", piName: "PI-1" },
      { name: "Sprint 1.3", start: "2025-02-17", end: "2025-03-07", piName: "PI-1" }
    ];

    let LANES = [
      { name: "Product" },
      { name: "Design" },
      { name: "Engineering" }
    ];

    let TASKS = [
      { name: "Define roadmap", start: "2025-01-06", end: "2025-01-10", status: "Done", owner: "Stan", lane: "Product" },
      { name: "Validate user needs", start: "2025-01-13", end: "2025-01-24", status: "In progress", owner: "Maya", lane: "Product" },
      { name: "Prototype timeline", start: "2025-01-27", end: "2025-02-07", status: "Planned", owner: "Lee", lane: "Design" },
      { name: "Review prototype", start: "2025-02-10", end: "2025-02-14", status: "Blocked", owner: "Stan", lane: "Design" },
      { name: "Prepare pilot", start: "2025-02-17", end: "2025-03-07", status: "Planned", owner: "Maya", lane: "Engineering" },
      { name: "Pilot Launch", start: "2025-03-10", end: "2025-03-10", status: "Planned", owner: "Maya", lane: "Engineering" }
    ];

    const TASK_STATUSES = ["planned", "in_progress", "done", "blocked"];
    const DESCRIPTION_POSITIONS = ["hidden", "above", "below"];
    const DEFAULT_TASK_COLOR = "#2563eb";
    const colorForTask = task =>
      /^#[0-9a-f]{6}$/i.test(task.color || "") ? task.color : DEFAULT_TASK_COLOR;
    const descriptionPositionForTask = task =>
      DESCRIPTION_POSITIONS.includes(task.descriptionPosition) ? task.descriptionPosition : "hidden";
    const escapeAnnotationText = text => text
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;");

    const taskRowStart = 2.75;

    const normalizeStatus = status => {
      const key = String(status || "").trim().toLowerCase().replace(/[\s-]+/g, "_");
      return TASK_STATUSES.includes(key) ? key : "unknown";
    };

    const statusLabel = status =>
      status === "unknown"
        ? "Unknown"
        : status.replaceAll("_", " ").replace(/^./, letter => letter.toUpperCase());

    const boundaryShapes = (items, line) => items.flatMap(({ start, end }) =>
      [start, end].map(date => ({
        type: "line",
        xref: "x",
        yref: "paper",
        x0: date,
        x1: date,
        y0: 0,
        y1: 1,
        line
      }))
    );

    const today = new Date();
    const todayLine = {
      type: "line",
      xref: "x",
      yref: "paper",
      x0: today,
      x1: today,
      y0: 0,
      y1: 1,
      line: { color: "#e11d48", width: 3, dash: "solid" },
      label: {
        text: "Today",
        textposition: "top right",
        font: { color: "#e11d48" }
      }
    };

    const chart = document.getElementById("roadmap-chart");
    const taskDescriptionOverlay = document.getElementById("task-description-overlay");
    const taskDescriptionTitle = document.getElementById("task-description-title");
    const taskDescriptionContent = document.getElementById("task-description-content");
    const taskDescriptionClose = document.getElementById("task-description-close");
    let chartReady;

    const closeTaskDescription = () => {
      taskDescriptionOverlay.hidden = true;
    };

    const showTaskDescription = task => {
      taskDescriptionTitle.textContent = task.name;
      taskDescriptionContent.textContent = task.description || "No description available.";
      taskDescriptionOverlay.hidden = false;
      taskDescriptionClose.focus();
    };

    taskDescriptionClose.addEventListener("click", closeTaskDescription);
    const handleChartClick = event => {
      const point = event.points?.[0];
      if (point?.data?.meta !== "task") return;
      showTaskDescription(point.customdata[5]);
    };

    const chartView = document.getElementById("chart-view");
    const configureView = document.getElementById("configure-view");
    const showChart = document.getElementById("show-chart");
    const showConfigure = document.getElementById("show-configure");

    const setView = view => {
      const chartIsActive = view === "chart";
      chartView.hidden = !chartIsActive;
      configureView.hidden = chartIsActive;
      showChart.setAttribute("aria-pressed", chartIsActive);
      showConfigure.setAttribute("aria-pressed", !chartIsActive);
      if (chartIsActive && chartReady) chartReady.then(() => Plotly.Plots.resize(chart));
    };

    showChart.addEventListener("click", () => setView("chart"));
    showConfigure.addEventListener("click", () => setView("configure"));
    window.addEventListener("resize", () => {
      if (!chartView.hidden && chartReady) chartReady.then(() => Plotly.Plots.resize(chart));
    });

    const renderChart = () => {
      const laneRowPositions = new Map(
        LANES.map(({ name }, index) => [name, taskRowStart + index])
      );
      const bandTrace = (items, row, color, name, width) => ({
        type: "bar",
        orientation: "h",
        x: items.map(({ start, end }) => Date.parse(end) - Date.parse(start)),
        base: items.map(({ start }) => start),
        y: items.map(() => row),
        text: items.map(({ name: itemName }) => itemName),
        textposition: "inside",
        insidetextanchor: "middle",
        customdata: items.map(({ start, end }) => [start, end]),
        hovertemplate: "%{text}<br>Start: %{customdata[0]}<br>End: %{customdata[1]}<extra></extra>",
        marker: { color },
        width,
        name
      });
      const tasksWithRows = TASKS.map(task => ({
        task,
        rowPosition: laneRowPositions.get(task.lane)
      }));
      const regularTasks = tasksWithRows.filter(({ task }) => task.start !== task.end);
      const milestones = tasksWithRows.filter(({ task }) => task.start === task.end);
      const descriptionAnnotations = tasksWithRows.flatMap(({ task, rowPosition }) => {
        const descriptionPosition = descriptionPositionForTask(task);
        const description = String(task.description || "").trim();
        if (descriptionPosition === "hidden" || !description) return [];
        const startTime = Date.parse(task.start);
        const endTime = Date.parse(task.end);
        return [{
          x: new Date(startTime + (endTime - startTime) / 2).toISOString(),
          y: rowPosition,
          xref: "x",
          yref: "y",
          text: escapeAnnotationText(description),
          showarrow: false,
          xanchor: "center",
          yanchor: descriptionPosition === "above" ? "bottom" : "top",
          yshift: descriptionPosition === "above" ? 18 : -18,
          align: "center"
        }];
      });
      const taskTraces = [
        ...(regularTasks.length ? [{
          type: "bar",
          meta: "task",
          orientation: "h",

        TASKS.push(task);
      } else {
        TASKS[editingTaskIndex] = task;
      }
      closeTaskEditor();
      renderTaskList();
      await refreshRoadmap();
    });

    renderTaskList();

    const openRoadmap = document.getElementById("open-roadmap");
    const saveRoadmap = document.getElementById("save-roadmap");
    const fileStatus = document.getElementById("file-status");
    let roadmapFileHandle = null;

    const filePickerOptions = {
      types: [{
        description: "Vizimap roadmap",
        accept: { "application/json": [".json"] }
      }]
    };

    const showFileError = (action, error) => {
      if (error.name === "AbortError") return;
      fileStatus.textContent = `Could not ${action}: ${error.message}`;
    };

    const requireFileSystemAccess = () => {
      if ("showOpenFilePicker" in window && "showSaveFilePicker" in window) return true;
      fileStatus.textContent = "Open and Save require Chrome or Edge with File System Access API support.";
      return false;
    };

    const parseRoadmap = text => {
      const roadmap = JSON.parse(text);
      if (
        !roadmap ||
        !Array.isArray(roadmap.programIncrements) ||
        !Array.isArray(roadmap.sprints) ||
        !Array.isArray(roadmap.lanes) ||
        !Array.isArray(roadmap.tasks)
      ) {
        throw new Error("Roadmap JSON must contain programIncrements, sprints, lanes, and tasks arrays.");
      }
      return roadmap;
    };

    openRoadmap.addEventListener("click", async () => {
      if (!requireFileSystemAccess()) return;
      openRoadmap.disabled = true;

      try {
        const [fileHandle] = await window.showOpenFilePicker(filePickerOptions);
        const file = await fileHandle.getFile();
        const roadmap = parseRoadmap(await file.text());

        PROGRAM_INCREMENTS = roadmap.programIncrements;
        SPRINTS = roadmap.sprints;
        LANES = roadmap.lanes;
        TASKS = roadmap.tasks;
        CHART_TITLE = typeof roadmap.chartTitle === "string"
          ? roadmap.chartTitle
          : DEFAULT_CHART_TITLE;
        X_AXIS_TITLE = typeof roadmap.xAxisTitle === "string"
          ? roadmap.xAxisTitle
          : DEFAULT_X_AXIS_TITLE;
        roadmapFileHandle = fileHandle;
        closePiEditor();
        closeSprintEditor();
        closeLaneEditor();
        closeTaskEditor();
        hideDeleteWarning();
        hideLaneDeleteWarning();
        renderPiList();
        renderSprintList();
        renderLaneList();
        renderTaskList();
        renderChartSettings();
        await refreshRoadmap();
        fileStatus.textContent = `Opened ${file.name}`;
      } catch (error) {
        showFileError("open roadmap", error);
      } finally {
        openRoadmap.disabled = false;
      }
    });

    saveRoadmap.addEventListener("click", async () => {
      if (!requireFileSystemAccess()) return;
      saveRoadmap.disabled = true;

      try {
        const fileHandle = roadmapFileHandle || await window.showSaveFilePicker({
          ...filePickerOptions,
          suggestedName: "roadmap.json"
        });
        const writable = await fileHandle.createWritable();
        await writable.write(JSON.stringify({
          programIncrements: PROGRAM_INCREMENTS,
          sprints: SPRINTS,
          lanes: LANES,
          tasks: TASKS,
          chartTitle: CHART_TITLE,
          xAxisTitle: X_AXIS_TITLE
        }, null, 2) + "\n");
        await writable.close();
        roadmapFileHandle = fileHandle;
        fileStatus.textContent = `Saved ${fileHandle.name}`;
      } catch (error) {
        showFileError("save roadmap", error);
      } finally {
        saveRoadmap.disabled = false;
      }
    });

    requireFileSystemAccess();
  </script>
</body>
</html>
