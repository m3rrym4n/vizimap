<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vizimap</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #172033; }
    main { margin: 0 auto; max-width: 1200px; padding: 1rem; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .view-toggle { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .view-toggle button[aria-pressed="true"] { background: #2563eb; color: white; }
    .roadmap-manager { border: 1px solid #cbd5e1; border-radius: 0.5rem; margin-top: 1rem; padding: 1rem; }
    .roadmap-manager h2 { display: inline-block; font-size: 1.2rem; margin: 0 1rem 0 0; }
    .manager-list { list-style: none; margin: 1rem 0 0; padding: 0; }
    .manager-list li { align-items: center; border-top: 1px solid #e2e8f0; display: flex; gap: 0.5rem; padding: 0.65rem 0; }
    .manager-details { flex: 1; }
    .manager-editor { background: #f8fafc; border-radius: 0.4rem; margin-top: 1rem; padding: 1rem; }
    .manager-editor[hidden] { display: none; }
    .manager-fields { display: flex; flex-wrap: wrap; gap: 0.75rem; }
    .manager-fields label { display: grid; gap: 0.25rem; }
    .manager-actions { display: flex; gap: 0.5rem; margin-top: 1rem; }
    .form-error, .delete-warning { color: #b91c1c; }
    .delete-warning { background: #fef2f2; border: 1px solid #fecaca; border-radius: 0.4rem; margin-top: 1rem; padding: 0.75rem; }
  </style>
</head>
<body>
  <main>
    <h1>Vizimap</h1>
    <nav class="view-toggle" aria-label="Roadmap view">
      <button id="show-chart" type="button" aria-pressed="true" aria-controls="chart-view">Chart</button>
      <button id="show-configure" type="button" aria-pressed="false" aria-controls="configure-view">Configure</button>
    </nav>
    <section id="chart-view" aria-label="Chart view">
      <label for="tick-mode">Timeline labels:</label>
      <select id="tick-mode">
        <option value="calendar" selected>Calendar</option>
        <option value="sprint">Sprint</option>
        <option value="pi">PI</option>
      </select>
      <button id="export-png" type="button">Export PNG</button>
      <div id="roadmap-chart" style="width: 100%; min-height: 480px;"></div>
    </section>
    <section id="configure-view" aria-label="Configure view" hidden>
      <button id="open-roadmap" type="button">Open Roadmap</button>
      <button id="save-roadmap" type="button">Save</button>
      <p id="file-status" role="status" aria-live="polite"></p>
      <section class="roadmap-manager" aria-labelledby="pi-manager-title">
      <h2 id="pi-manager-title">Program Increments</h2>
      <button id="add-pi" type="button">Add PI</button>
      <div id="pi-delete-warning" class="delete-warning" role="alert" hidden></div>
      <form id="pi-editor" class="manager-editor" hidden novalidate>
        <div class="manager-fields">
          <label>Name <input id="pi-name" name="name" type="text" required></label>
          <label>Start date <input id="pi-start" name="start" type="date" required></label>
          <label>End date <input id="pi-end" name="end" type="date" required></label>
        </div>
        <p id="pi-form-error" class="form-error" role="alert" hidden></p>
        <div class="manager-actions">
          <button id="save-pi" type="submit">Add PI</button>
          <button id="cancel-pi" type="button">Cancel</button>
        </div>
      </form>
      <ul id="pi-list" class="manager-list"></ul>
      </section>
      <section class="roadmap-manager" aria-labelledby="sprint-manager-title">
      <h2 id="sprint-manager-title">Sprints</h2>
      <button id="add-sprint" type="button">Add Sprint</button>
      <form id="sprint-editor" class="manager-editor" hidden novalidate>
        <div class="manager-fields">
          <label>Name <input id="sprint-name" name="name" type="text" required></label>
          <label>Start date <input id="sprint-start" name="start" type="date" required></label>
          <label>End date <input id="sprint-end" name="end" type="date" required></label>
          <label>Parent PI
            <select id="sprint-pi" name="piName" required></select>
          </label>
        </div>
        <p id="sprint-form-error" class="form-error" role="alert" hidden></p>
        <div class="manager-actions">
          <button id="save-sprint" type="submit">Add Sprint</button>
          <button id="cancel-sprint" type="button">Cancel</button>
        </div>
      </form>
      <ul id="sprint-list" class="manager-list"></ul>
      </section>
      <section class="roadmap-manager" aria-labelledby="lane-manager-title">
      <h2 id="lane-manager-title">Lanes</h2>
      <button id="add-lane" type="button">Add Lane</button>
      <div id="lane-delete-warning" class="delete-warning" role="alert" hidden></div>
      <form id="lane-editor" class="manager-editor" hidden novalidate>
        <div class="manager-fields">
          <label>Name <input id="lane-name" name="name" type="text" required></label>
        </div>
        <p id="lane-form-error" class="form-error" role="alert" hidden></p>
        <div class="manager-actions">
          <button id="save-lane" type="submit">Add Lane</button>
          <button id="cancel-lane" type="button">Cancel</button>
        </div>
      </form>
      <ul id="lane-list" class="manager-list"></ul>
      </section>
      <section class="roadmap-manager" aria-labelledby="task-manager-title">
      <h2 id="task-manager-title">Tasks</h2>
      <button id="add-task" type="button">Add Task</button>
      <form id="task-editor" class="manager-editor" hidden novalidate>
        <div class="manager-fields">
          <label>Name <input id="task-name" name="name" type="text" required></label>
          <label>Start date <input id="task-start" name="start" type="date" required></label>
          <label>End date <input id="task-end" name="end" type="date" required></label>
          <label>Status
            <select id="task-status" name="status" required></select>
          </label>
          <label>Owner <input id="task-owner" name="owner" type="text"></label>
          <label>Lane
            <select id="task-lane" name="lane" required></select>
          </label>
          <label>Description <textarea id="task-description" name="description" rows="4"></textarea></label>
        </div>
        <p id="task-form-error" class="form-error" role="alert" hidden></p>
        <div class="manager-actions">
          <button id="save-task" type="submit">Add Task</button>
          <button id="cancel-task" type="button">Cancel</button>
        </div>
      </form>
      <ul id="task-list" class="manager-list"></ul>
      </section>
    </section>
  </main>

  <script>
    let PROGRAM_INCREMENTS = [
      { name: "PI-1", start: "2025-01-06", end: "2025-03-28" },
      { name: "PI-2", start: "2025-03-31", end: "2025-06-20" }
    ];

    let SPRINTS = [
      { name: "Sprint 1.1", start: "2025-01-06", end: "2025-01-24", piName: "PI-1" },
      { name: "Sprint 1.2", start: "2025-01-27", end: "2025-02-14", piName: "PI-1" },
      { name: "Sprint 1.3", start: "2025-02-17", end: "2025-03-07", piName: "PI-1" }
    ];

    let LANES = [
      { name: "Product" },
      { name: "Design" },
      { name: "Engineering" }
    ];

    let TASKS = [
      { name: "Define roadmap", start: "2025-01-06", end: "2025-01-10", status: "Done", owner: "Stan", lane: "Product" },
      { name: "Validate user needs", start: "2025-01-13", end: "2025-01-24", status: "In progress", owner: "Maya", lane: "Product" },
      { name: "Prototype timeline", start: "2025-01-27", end: "2025-02-07", status: "Planned", owner: "Lee", lane: "Design" },
      { name: "Review prototype", start: "2025-02-10", end: "2025-02-14", status: "Blocked", owner: "Stan", lane: "Design" },
      { name: "Prepare pilot", start: "2025-02-17", end: "2025-03-07", status: "Planned", owner: "Maya", lane: "Engineering" },
      { name: "Pilot Launch", start: "2025-03-10", end: "2025-03-10", status: "Planned", owner: "Maya", lane: "Engineering" }
    ];

    const STATUS_COLORS = {
      planned: "#64748b",
      in_progress: "#2563eb",
      done: "#16a34a",
      blocked: "#dc2626"
    };
    const UNKNOWN_STATUS_COLOR = "#a1a1aa";

    const taskRowStart = 2.75;

    const normalizeStatus = status => {
      const key = String(status || "").trim().toLowerCase().replace(/[\s-]+/g, "_");
      return Object.hasOwn(STATUS_COLORS, key) ? key : "unknown";
    };

    const statusLabel = status =>
      status === "unknown"
        ? "Unknown"
        : status.replaceAll("_", " ").replace(/^./, letter => letter.toUpperCase());

    const boundaryShapes = (items, line) => items.flatMap(({ start, end }) =>
      [start, end].map(date => ({
        type: "line",
        xref: "x",
        yref: "paper",
        x0: date,
        x1: date,
        y0: 0,
        y1: 1,
        line
      }))
    );

    const today = new Date();
    const todayLine = {
      type: "line",
      xref: "x",
      yref: "paper",
      x0: today,
      x1: today,
      y0: 0,
      y1: 1,
      line: { color: "#e11d48", width: 3, dash: "solid" },
      label: {
        text: "Today",
        textposition: "top right",
        font: { color: "#e11d48" }
      }
    };

    const chart = document.getElementById("roadmap-chart");
    let chartReady;

    const chartView = document.getElementById("chart-view");
    const configureView = document.getElementById("configure-view");
    const showChart = document.getElementById("show-chart");
    const showConfigure = document.getElementById("show-configure");

    const setView = view => {
      const chartIsActive = view === "chart";
      chartView.hidden = !chartIsActive;
      configureView.hidden = chartIsActive;
      showChart.setAttribute("aria-pressed", chartIsActive);
      showConfigure.setAttribute("aria-pressed", !chartIsActive);
      if (chartIsActive && chartReady) chartReady.then(() => Plotly.Plots.resize(chart));
    };

    showChart.addEventListener("click", () => setView("chart"));
    showConfigure.addEventListener("click", () => setView("configure"));

    const renderChart = () => {
      const laneRowPositions = new Map(
        LANES.map(({ name }, index) => [name, taskRowStart + index])
      );
      const bandTrace = (items, row, color, name, width) => ({
        type: "bar",
        orientation: "h",
        x: items.map(({ start, end }) => Date.parse(end) - Date.parse(start)),
        base: items.map(({ start }) => start),
        y: items.map(() => row),
        text: items.map(({ name: itemName }) => itemName),
        textposition: "inside",
        insidetextanchor: "middle",
        customdata: items.map(({ start, end }) => [start, end]),
        hovertemplate: "%{text}<br>Start: %{customdata[0]}<br>End: %{customdata[1]}<extra></extra>",
        marker: { color },
        width,
        name,
        showlegend: false
      });
      const taskTraces = [
        ...Object.entries(STATUS_COLORS),
        ["unknown", UNKNOWN_STATUS_COLOR]
      ].flatMap(([statusKey, color]) => {
        const tasksForStatus = TASKS
          .map(task => ({ task, rowPosition: laneRowPositions.get(task.lane) }))
          .filter(({ task }) => normalizeStatus(task.status) === statusKey);
        const regularTasks = tasksForStatus.filter(({ task }) => task.start !== task.end);
        const milestones = tasksForStatus.filter(({ task }) => task.start === task.end);
        const statusName = statusLabel(statusKey);
        const barTrace = {
          type: "bar",
          orientation: "h",
          x: regularTasks.map(({ task: { start, end } }) => Date.parse(end) - Date.parse(start)),
          base: regularTasks.map(({ task: { start } }) => start),
          y: regularTasks.map(({ rowPosition }) => rowPosition),
          customdata: regularTasks.map(({ task: { name, start, end, status, owner } }) =>
            [name, start, end, status || "Unknown", owner]
          ),
          hovertemplate: regularTasks.map(({ task: { owner } }) =>
            "%{customdata[0]}<br>Start: %{customdata[1]}<br>End: %{customdata[2]}" +
            "<br>Status: %{customdata[3]}" +
            (owner ? "<br>Owner: %{customdata[4]}" : "") +
            "<extra></extra>"
          ),
          marker: { color },
          width: 0.6,
          name: statusName,
          legendgroup: "task-status"
        };
        const milestoneTrace = {
          type: "scatter",
          mode: "markers+text",
          x: milestones.map(({ task: { start } }) => start),
          y: milestones.map(({ rowPosition }) => rowPosition),
          text: milestones.map(({ task: { name } }) => name),
          textposition: "top center",
          customdata: milestones.map(({ task: { name, start, status, owner } }) =>
            [name, start, status || "Unknown", owner]
          ),
          hovertemplate: milestones.map(({ task: { owner } }) =>
            "%{customdata[0]}<br>Date: %{customdata[1]}" +
            "<br>Status: %{customdata[2]}" +
            (owner ? "<br>Owner: %{customdata[3]}" : "") +
            "<extra></extra>"
          ),
          marker: { color, size: 14, symbol: "diamond" },
          name: statusName,
          legendgroup: "task-status",
          showlegend: !regularTasks.length,
          cliponaxis: false
        };

        return [
          ...(regularTasks.length ? [barTrace] : []),
          ...(milestones.length ? [milestoneTrace] : [])
        ];
      });
      const alignmentGridlines = [
        ...boundaryShapes(SPRINTS, { color: "#cbd5e1", width: 1, dash: "dot" }),
        ...boundaryShapes(PROGRAM_INCREMENTS, { color: "#64748b", width: 2, dash: "dash" })
      ];

      chartReady = Plotly.react(
        chart,
        [
          bandTrace(PROGRAM_INCREMENTS, 0, "#2563eb", "Program Increments", 0.7),
          bandTrace(SPRINTS, 1, "#93c5fd", "Sprints", 0.45),
          ...taskTraces
        ],
        {
        title: "Product Roadmap",
        barmode: "overlay",
        shapes: [...alignmentGridlines, todayLine],
        legend: { title: { text: "Task status" } },
        xaxis: {
          type: "date",
          title: "Date",
          rangeslider: { visible: true }
        },
        yaxis: {
          tickmode: "array",
          tickvals: [0, 1, ...laneRowPositions.values()],
          ticktext: ["Program Increments", "Sprints", ...LANES.map(({ name }) => name)],
          range: [taskRowStart + LANES.length - 0.4, -0.6],
          automargin: true
        }
        },
        { responsive: true }
      );
      return chartReady;
    };

    renderChart();

    const exportPng = document.getElementById("export-png");
    exportPng.addEventListener("click", async () => {
      exportPng.disabled = true;

      try {
        await chartReady;
        const date = new Date();
        const dateStamp = [
          date.getFullYear(),
          String(date.getMonth() + 1).padStart(2, "0"),
          String(date.getDate()).padStart(2, "0")
        ].join("-");

        await Plotly.downloadImage(chart, {
          format: "png",
          filename: `roadmap-${dateStamp}`,
          width: chart._fullLayout.width,
          height: chart._fullLayout.height,
          scale: 2
        });
      } catch (error) {
        alert(`Could not export the roadmap: ${error.message}`);
      } finally {
        exportPng.disabled = false;
      }
    });

    const tickMode = document.getElementById("tick-mode");
    tickMode.addEventListener("change", () => {
      const tickItems = tickMode.value === "sprint"
        ? SPRINTS
        : tickMode.value === "pi"
          ? PROGRAM_INCREMENTS
          : null;

      Plotly.relayout("roadmap-chart", tickItems
        ? {
            "xaxis.tickmode": "array",
            "xaxis.tickvals": tickItems.map(({ start }) => start),
            "xaxis.ticktext": tickItems.map(({ name }) => name)
          }
        : {
            "xaxis.tickmode": "auto",
            "xaxis.tickvals": null,
            "xaxis.ticktext": null
          }
      );
    });

    const piList = document.getElementById("pi-list");
    const piEditor = document.getElementById("pi-editor");
    const piName = document.getElementById("pi-name");
    const piStart = document.getElementById("pi-start");
    const piEnd = document.getElementById("pi-end");
    const piFormError = document.getElementById("pi-form-error");
    const piDeleteWarning = document.getElementById("pi-delete-warning");
    const savePi = document.getElementById("save-pi");
    let editingPiIndex = null;

    const refreshRoadmap = async () => {
      await renderChart();
      tickMode.dispatchEvent(new Event("change"));
    };

    const hideDeleteWarning = () => {
      piDeleteWarning.hidden = true;
      piDeleteWarning.replaceChildren();
    };

    const closePiEditor = () => {
      editingPiIndex = null;
      piEditor.reset();
      piEditor.hidden = true;
      piFormError.hidden = true;
    };

    const openPiEditor = index => {
      hideDeleteWarning();
      editingPiIndex = index;
      piEditor.reset();
      piFormError.hidden = true;

      if (index === null) {
        savePi.textContent = "Add PI";
      } else {
        const pi = PROGRAM_INCREMENTS[index];
        piName.value = pi.name;
        piStart.value = pi.start;
        piEnd.value = pi.end;
        savePi.textContent = "Save changes";
      }

      piEditor.hidden = false;
      piName.focus();
    };

    const deletePi = async index => {
      PROGRAM_INCREMENTS.splice(index, 1);
      closePiEditor();
      hideDeleteWarning();
      renderPiList();
      await refreshRoadmap();
    };

    const requestPiDelete = index => {
      closePiEditor();
      hideDeleteWarning();
      const pi = PROGRAM_INCREMENTS[index];
      const referencedSprints = SPRINTS.filter(sprint => sprint.piName === pi.name);

      if (!referencedSprints.length) {
        deletePi(index);
        return;
      }

      const message = document.createElement("p");
      const sprintNames = referencedSprints.map(({ name }) => name).join(", ");
      message.textContent = `Cannot safely delete ${pi.name}: ${referencedSprints.length} sprint${referencedSprints.length === 1 ? "" : "s"} reference it (${sprintNames}). Deleting it will leave those references orphaned.`;
      const confirmDelete = document.createElement("button");
      confirmDelete.type = "button";
      confirmDelete.textContent = "Delete PI anyway";
      confirmDelete.addEventListener("click", () => deletePi(index));
      const cancelDelete = document.createElement("button");
      cancelDelete.type = "button";
      cancelDelete.textContent = "Cancel";
      cancelDelete.addEventListener("click", hideDeleteWarning);
      piDeleteWarning.append(message, confirmDelete, " ", cancelDelete);
      piDeleteWarning.hidden = false;
      piDeleteWarning.scrollIntoView({ block: "nearest" });
    };

    const renderPiList = () => {
      piList.replaceChildren();
      PROGRAM_INCREMENTS.forEach((pi, index) => {
        const item = document.createElement("li");
        const details = document.createElement("span");
        details.className = "manager-details";
        details.textContent = `${pi.name}: ${pi.start} – ${pi.end}`;
        const edit = document.createElement("button");
        edit.type = "button";
        edit.textContent = "Edit";
        edit.setAttribute("aria-label", `Edit ${pi.name}`);
        edit.addEventListener("click", () => openPiEditor(index));
        const remove = document.createElement("button");
        remove.type = "button";
        remove.textContent = "Delete";
        remove.setAttribute("aria-label", `Delete ${pi.name}`);
        remove.addEventListener("click", () => requestPiDelete(index));
        item.append(details, edit, remove);
        piList.append(item);
      });

      if (!PROGRAM_INCREMENTS.length) {
        const empty = document.createElement("li");
        empty.textContent = "No Program Increments yet.";
        piList.append(empty);
      }
    };

    document.getElementById("add-pi").addEventListener("click", () => openPiEditor(null));
    document.getElementById("cancel-pi").addEventListener("click", closePiEditor);
    piEditor.addEventListener("submit", async event => {
      event.preventDefault();
      const name = piName.value.trim();
      const start = piStart.value;
      const end = piEnd.value;

      if (!name) {
        piFormError.textContent = "Name is required.";
        piFormError.hidden = false;
        piName.focus();
        return;
      }
      if (!start || !end) {
        piFormError.textContent = "Start date and end date are required.";
        piFormError.hidden = false;
        (!start ? piStart : piEnd).focus();
        return;
      }
      if (end <= start) {
        piFormError.textContent = "End date must be after start date.";
        piFormError.hidden = false;
        piEnd.focus();
        return;
      }

      const programIncrement = { name, start, end };
      if (editingPiIndex === null) {
        PROGRAM_INCREMENTS.push(programIncrement);
      } else {
        PROGRAM_INCREMENTS[editingPiIndex] = programIncrement;
      }
      closePiEditor();
      renderPiList();
      await refreshRoadmap();
    });

    renderPiList();

    const sprintList = document.getElementById("sprint-list");
    const sprintEditor = document.getElementById("sprint-editor");
    const sprintName = document.getElementById("sprint-name");
    const sprintStart = document.getElementById("sprint-start");
    const sprintEnd = document.getElementById("sprint-end");
    const sprintPi = document.getElementById("sprint-pi");
    const sprintFormError = document.getElementById("sprint-form-error");
    const saveSprint = document.getElementById("save-sprint");
    let editingSprintIndex = null;

    const populatePiOptions = selectedPiName => {
      sprintPi.replaceChildren();
      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = PROGRAM_INCREMENTS.length ? "Select a PI" : "No Program Increments available";
      sprintPi.append(placeholder);

      PROGRAM_INCREMENTS.forEach(({ name }) => {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        option.selected = name === selectedPiName;
        sprintPi.append(option);
      });
    };

    const closeSprintEditor = () => {
      editingSprintIndex = null;
      sprintEditor.reset();
      sprintEditor.hidden = true;
      sprintFormError.hidden = true;
    };

    const openSprintEditor = index => {
      editingSprintIndex = index;
      sprintEditor.reset();
      sprintFormError.hidden = true;
      const sprint = index === null ? null : SPRINTS[index];
      populatePiOptions(sprint?.piName);

      if (sprint) {
        sprintName.value = sprint.name;
        sprintStart.value = sprint.start;
        sprintEnd.value = sprint.end;
        saveSprint.textContent = "Save changes";
      } else {
        saveSprint.textContent = "Add Sprint";
      }

      sprintEditor.hidden = false;
      sprintName.focus();
    };

    const deleteSprint = async index => {
      SPRINTS.splice(index, 1);
      closeSprintEditor();
      renderSprintList();
      await refreshRoadmap();
    };

    const renderSprintList = () => {
      sprintList.replaceChildren();
      SPRINTS.forEach((sprint, index) => {
        const item = document.createElement("li");
        const details = document.createElement("span");
        details.className = "manager-details";
        details.textContent = `${sprint.name}: ${sprint.start} – ${sprint.end} (${sprint.piName})`;
        const edit = document.createElement("button");
        edit.type = "button";
        edit.textContent = "Edit";
        edit.setAttribute("aria-label", `Edit ${sprint.name}`);
        edit.addEventListener("click", () => openSprintEditor(index));
        const remove = document.createElement("button");
        remove.type = "button";
        remove.textContent = "Delete";
        remove.setAttribute("aria-label", `Delete ${sprint.name}`);
        remove.addEventListener("click", () => deleteSprint(index));
        item.append(details, edit, remove);
        sprintList.append(item);
      });

      if (!SPRINTS.length) {
        const empty = document.createElement("li");
        empty.textContent = "No Sprints yet.";
        sprintList.append(empty);
      }
    };

    document.getElementById("add-sprint").addEventListener("click", () => openSprintEditor(null));
    document.getElementById("cancel-sprint").addEventListener("click", closeSprintEditor);
    sprintEditor.addEventListener("submit", async event => {
      event.preventDefault();
      const name = sprintName.value.trim();
      const start = sprintStart.value;
      const end = sprintEnd.value;
      const piName = sprintPi.value;

      if (!name) {
        sprintFormError.textContent = "Name is required.";
        sprintFormError.hidden = false;
        sprintName.focus();
        return;
      }
      if (!start || !end) {
        sprintFormError.textContent = "Start date and end date are required.";
        sprintFormError.hidden = false;
        (!start ? sprintStart : sprintEnd).focus();
        return;
      }
      if (end <= start) {
        sprintFormError.textContent = "End date must be after start date.";
        sprintFormError.hidden = false;
        sprintEnd.focus();
        return;
      }
      if (!PROGRAM_INCREMENTS.some(({ name: piNameOption }) => piNameOption === piName)) {
        sprintFormError.textContent = "Select a parent PI from the current Program Increments.";
        sprintFormError.hidden = false;
        sprintPi.focus();
        return;
      }

      const sprint = { name, start, end, piName };
      if (editingSprintIndex === null) {
        SPRINTS.push(sprint);
      } else {
        SPRINTS[editingSprintIndex] = sprint;
      }
      closeSprintEditor();
      renderSprintList();
      await refreshRoadmap();
    });

    renderSprintList();

    const laneList = document.getElementById("lane-list");
    const laneEditor = document.getElementById("lane-editor");
    const laneName = document.getElementById("lane-name");
    const laneFormError = document.getElementById("lane-form-error");
    const laneDeleteWarning = document.getElementById("lane-delete-warning");
    const saveLane = document.getElementById("save-lane");
    let editingLaneIndex = null;

    const hideLaneDeleteWarning = () => {
      laneDeleteWarning.hidden = true;
      laneDeleteWarning.replaceChildren();
    };

    const closeLaneEditor = () => {
      editingLaneIndex = null;
      laneEditor.reset();
      laneEditor.hidden = true;
      laneFormError.hidden = true;
    };

    const openLaneEditor = index => {
      hideLaneDeleteWarning();
      editingLaneIndex = index;
      laneEditor.reset();
      laneFormError.hidden = true;

      if (index === null) {
        saveLane.textContent = "Add Lane";
      } else {
        laneName.value = LANES[index].name;
        saveLane.textContent = "Save changes";
      }

      laneEditor.hidden = false;
      laneName.focus();
    };

    const deleteLane = async index => {
      LANES.splice(index, 1);
      closeLaneEditor();
      hideLaneDeleteWarning();
      renderLaneList();
      await refreshRoadmap();
    };

    const requestLaneDelete = index => {
      closeLaneEditor();
      hideLaneDeleteWarning();
      const lane = LANES[index];
      const referencedTasks = TASKS.filter(task => task.lane === lane.name);

      if (!referencedTasks.length) {
        deleteLane(index);
        return;
      }

      const message = document.createElement("p");
      const taskNames = referencedTasks.map(({ name }) => name).join(", ");
      message.textContent = `Cannot safely delete ${lane.name}: ${referencedTasks.length} task${referencedTasks.length === 1 ? "" : "s"} reference it (${taskNames}). Deleting it will leave those references orphaned.`;
      const confirmDelete = document.createElement("button");
      confirmDelete.type = "button";
      confirmDelete.textContent = "Delete Lane anyway";
      confirmDelete.addEventListener("click", () => deleteLane(index));
      const cancelDelete = document.createElement("button");
      cancelDelete.type = "button";
      cancelDelete.textContent = "Cancel";
      cancelDelete.addEventListener("click", hideLaneDeleteWarning);
      laneDeleteWarning.append(message, confirmDelete, " ", cancelDelete);
      laneDeleteWarning.hidden = false;
      laneDeleteWarning.scrollIntoView({ block: "nearest" });
    };

    const moveLane = async (index, offset) => {
      const destination = index + offset;
      if (destination < 0 || destination >= LANES.length) return;
      [LANES[index], LANES[destination]] = [LANES[destination], LANES[index]];
      closeLaneEditor();
      hideLaneDeleteWarning();
      renderLaneList();
      await refreshRoadmap();
    };

    const renderLaneList = () => {
      laneList.replaceChildren();
      LANES.forEach((lane, index) => {
        const item = document.createElement("li");
        const details = document.createElement("span");
        details.className = "manager-details";
        details.textContent = lane.name;
        const moveUp = document.createElement("button");
        moveUp.type = "button";
        moveUp.textContent = "Move up";
        moveUp.disabled = index === 0;
        moveUp.setAttribute("aria-label", `Move ${lane.name} up`);
        moveUp.addEventListener("click", () => moveLane(index, -1));
        const moveDown = document.createElement("button");
        moveDown.type = "button";
        moveDown.textContent = "Move down";
        moveDown.disabled = index === LANES.length - 1;
        moveDown.setAttribute("aria-label", `Move ${lane.name} down`);
        moveDown.addEventListener("click", () => moveLane(index, 1));
        const edit = document.createElement("button");
        edit.type = "button";
        edit.textContent = "Edit";
        edit.setAttribute("aria-label", `Edit ${lane.name}`);
        edit.addEventListener("click", () => openLaneEditor(index));
        const remove = document.createElement("button");
        remove.type = "button";
        remove.textContent = "Delete";
        remove.setAttribute("aria-label", `Delete ${lane.name}`);
        remove.addEventListener("click", () => requestLaneDelete(index));
        item.append(details, moveUp, moveDown, edit, remove);
        laneList.append(item);
      });

      if (!LANES.length) {
        const empty = document.createElement("li");
        empty.textContent = "No Lanes yet.";
        laneList.append(empty);
      }
    };

    document.getElementById("add-lane").addEventListener("click", () => openLaneEditor(null));
    document.getElementById("cancel-lane").addEventListener("click", closeLaneEditor);
    laneEditor.addEventListener("submit", async event => {
      event.preventDefault();
      const name = laneName.value.trim();

      if (!name) {
        laneFormError.textContent = "Name is required.";
        laneFormError.hidden = false;
        laneName.focus();
        return;
      }
      if (LANES.some((lane, index) => lane.name === name && index !== editingLaneIndex)) {
        laneFormError.textContent = "Lane name must be unique.";
        laneFormError.hidden = false;
        laneName.focus();
        return;
      }

      if (editingLaneIndex === null) {
        LANES.push({ name });
      } else {
        const previousName = LANES[editingLaneIndex].name;
        LANES[editingLaneIndex] = { name };
        TASKS.forEach(task => {
          if (task.lane === previousName) task.lane = name;
        });
      }
      closeLaneEditor();
      renderLaneList();
      await refreshRoadmap();
    });

    renderLaneList();

    const taskList = document.getElementById("task-list");
    const taskEditor = document.getElementById("task-editor");
    const taskName = document.getElementById("task-name");
    const taskStart = document.getElementById("task-start");
    const taskEnd = document.getElementById("task-end");
    const taskStatus = document.getElementById("task-status");
    const taskOwner = document.getElementById("task-owner");
    const taskLane = document.getElementById("task-lane");
    const taskDescription = document.getElementById("task-description");
    const taskFormError = document.getElementById("task-form-error");
    const saveTask = document.getElementById("save-task");
    let editingTaskIndex = null;

    Object.keys(STATUS_COLORS).forEach(status => {
      const option = document.createElement("option");
      option.value = status;
      option.textContent = statusLabel(status);
      taskStatus.append(option);
    });

    const populateLaneOptions = selectedLaneName => {
      taskLane.replaceChildren();
      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = LANES.length ? "Select a Lane" : "No Lanes available";
      taskLane.append(placeholder);

      LANES.forEach(({ name }) => {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        option.selected = name === selectedLaneName;
        taskLane.append(option);
      });
    };

    const closeTaskEditor = () => {
      editingTaskIndex = null;
      taskEditor.reset();
      taskEditor.hidden = true;
      taskFormError.hidden = true;
    };

    const openTaskEditor = index => {
      editingTaskIndex = index;
      taskEditor.reset();
      taskFormError.hidden = true;
      const task = index === null ? null : TASKS[index];
      populateLaneOptions(task?.lane);

      if (index === null) {
        saveTask.textContent = "Add Task";
      } else {
        taskName.value = task.name;
        taskStart.value = task.start;
        taskEnd.value = task.end;
        taskStatus.value = normalizeStatus(task.status);
        taskOwner.value = task.owner || "";
        taskDescription.value = task.description || "";
        saveTask.textContent = "Save changes";
      }

      taskEditor.hidden = false;
      taskName.focus();
    };

    const deleteTask = async index => {
      TASKS.splice(index, 1);
      closeTaskEditor();
      renderTaskList();
      await refreshRoadmap();
    };

    const renderTaskList = () => {
      taskList.replaceChildren();
      TASKS.forEach((task, index) => {
        const item = document.createElement("li");
        const details = document.createElement("span");
        details.className = "manager-details";
        const ownerDetails = task.owner ? ` · ${task.owner}` : "";
        details.textContent = `${task.name}: ${task.start} – ${task.end} (${statusLabel(normalizeStatus(task.status))}${ownerDetails})`;
        const edit = document.createElement("button");
        edit.type = "button";
        edit.textContent = "Edit";
        edit.setAttribute("aria-label", `Edit ${task.name}`);
        edit.addEventListener("click", () => openTaskEditor(index));
        const remove = document.createElement("button");
        remove.type = "button";
        remove.textContent = "Delete";
        remove.setAttribute("aria-label", `Delete ${task.name}`);
        remove.addEventListener("click", () => deleteTask(index));
        item.append(details, edit, remove);
        taskList.append(item);
      });

      if (!TASKS.length) {
        const empty = document.createElement("li");
        empty.textContent = "No Tasks yet.";
        taskList.append(empty);
      }
    };

    document.getElementById("add-task").addEventListener("click", () => openTaskEditor(null));
    document.getElementById("cancel-task").addEventListener("click", closeTaskEditor);
    taskEditor.addEventListener("submit", async event => {
      event.preventDefault();
      const name = taskName.value.trim();
      const start = taskStart.value;
      const end = taskEnd.value;
      const status = taskStatus.value;
      const owner = taskOwner.value.trim();
      const lane = taskLane.value;
      const description = taskDescription.value.trim();

      if (!name) {
        taskFormError.textContent = "Name is required.";
        taskFormError.hidden = false;
        taskName.focus();
        return;
      }
      if (!start || !end) {
        taskFormError.textContent = "Start date and end date are required.";
        taskFormError.hidden = false;
        (!start ? taskStart : taskEnd).focus();
        return;
      }
      if (end <= start) {
        taskFormError.textContent = "End date must be after start date.";
        taskFormError.hidden = false;
        taskEnd.focus();
        return;
      }
      if (!Object.hasOwn(STATUS_COLORS, status)) {
        taskFormError.textContent = "Select a status from the available options.";
        taskFormError.hidden = false;
        taskStatus.focus();
        return;
      }

      if (!LANES.some(({ name: laneNameOption }) => laneNameOption === lane)) {
        taskFormError.textContent = "Select a lane from the current Lanes.";
        taskFormError.hidden = false;
        taskLane.focus();
        return;
      }
      const task = { name, start, end, status, lane };
      if (owner) task.owner = owner;
      if (description) task.description = description;
      if (editingTaskIndex === null) {
        TASKS.push(task);
      } else {
        TASKS[editingTaskIndex] = task;
      }
      closeTaskEditor();
      renderTaskList();
      await refreshRoadmap();
    });

    renderTaskList();

    const openRoadmap = document.getElementById("open-roadmap");
    const saveRoadmap = document.getElementById("save-roadmap");
    const fileStatus = document.getElementById("file-status");
    let roadmapFileHandle = null;

    const filePickerOptions = {
      types: [{
        description: "Vizimap roadmap",
        accept: { "application/json": [".json"] }
      }]
    };

    const showFileError = (action, error) => {
      if (error.name === "AbortError") return;
      fileStatus.textContent = `Could not ${action}: ${error.message}`;
    };

    const requireFileSystemAccess = () => {
      if ("showOpenFilePicker" in window && "showSaveFilePicker" in window) return true;
      fileStatus.textContent = "Open and Save require Chrome or Edge with File System Access API support.";
      return false;
    };

    const parseRoadmap = text => {
      const roadmap = JSON.parse(text);
      if (
        !roadmap ||
        !Array.isArray(roadmap.programIncrements) ||
        !Array.isArray(roadmap.sprints) ||
        !Array.isArray(roadmap.lanes) ||
        !Array.isArray(roadmap.tasks)
      ) {
        throw new Error("Roadmap JSON must contain programIncrements, sprints, lanes, and tasks arrays.");
      }
      return roadmap;
    };

    openRoadmap.addEventListener("click", async () => {
      if (!requireFileSystemAccess()) return;
      openRoadmap.disabled = true;

      try {
        const [fileHandle] = await window.showOpenFilePicker(filePickerOptions);
        const file = await fileHandle.getFile();
        const roadmap = parseRoadmap(await file.text());

        PROGRAM_INCREMENTS = roadmap.programIncrements;
        SPRINTS = roadmap.sprints;
        LANES = roadmap.lanes;
        TASKS = roadmap.tasks;
        roadmapFileHandle = fileHandle;
        closePiEditor();
        closeSprintEditor();
        closeLaneEditor();
        closeTaskEditor();
        hideDeleteWarning();
        hideLaneDeleteWarning();
        renderPiList();
        renderSprintList();
        renderLaneList();
        renderTaskList();
        await refreshRoadmap();
        fileStatus.textContent = `Opened ${file.name}`;
      } catch (error) {
        showFileError("open roadmap", error);
      } finally {
        openRoadmap.disabled = false;
      }
    });

    saveRoadmap.addEventListener("click", async () => {
      if (!requireFileSystemAccess()) return;
      saveRoadmap.disabled = true;

      try {
        const fileHandle = roadmapFileHandle || await window.showSaveFilePicker({
          ...filePickerOptions,
          suggestedName: "roadmap.json"
        });
        const writable = await fileHandle.createWritable();
        await writable.write(JSON.stringify({
          programIncrements: PROGRAM_INCREMENTS,
          sprints: SPRINTS,
          lanes: LANES,
          tasks: TASKS
        }, null, 2) + "\n");
        await writable.close();
        roadmapFileHandle = fileHandle;
        fileStatus.textContent = `Saved ${fileHandle.name}`;
      } catch (error) {
        showFileError("save roadmap", error);
      } finally {
        saveRoadmap.disabled = false;
      }
    });

    requireFileSystemAccess();
  </script>
</body>
</html>
